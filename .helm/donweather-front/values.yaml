replicaCount: 1

image:
  repository: buildbyte-container-registry.registry.twcstorage.ru/donweather-front
  pullPolicy: IfNotPresent
  tag: dev
  digest: "sha256:69f7ea0dce9cd76656bd24e9db87f44a423b34d13fd212d6ccd829c08a964c4f"

imagePullSecrets:
  - name: docker-registry-credentials
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

containerPort: 80

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

env: {}
envFrom: []

# Gateway API HTTPRoute (вместо Ingress).
httpRoute:
  enabled: true
  annotations: {}
  # parentRefs определяют к какому Gateway/Listener прикрепить маршрут.
  # Пример:
  # parentRefs:
  #   - name: my-gateway
  #     namespace: default
  #     sectionName: http
  # По умолчанию цепляемся к dev-gateway (HTTPS listener).
  parentRefs:
    - name: dev-gateway
      namespace: default
      sectionName: https
  hostnames:
    - donweather.dev.buildbyte.ru
  pathPrefix: /
  # Если нужно — можно передать полный массив spec.rules (как в Gateway API).
  rules: []

  # Redirect HTTP(80) -> HTTPS(443). Важно: укажите parentRefs на HTTP listener (например sectionName: http),
  # иначе при привязке к HTTPS listener получите redirect-loop.
  redirectToHttps:
    enabled: true
    annotations: {}
    # parentRefs для HTTP listener (обычно тот же Gateway, но sectionName=http)
    parentRefs:
      - name: dev-gateway
        namespace: default
        sectionName: http
    statusCode: 301
    scheme: https
    port: 443
