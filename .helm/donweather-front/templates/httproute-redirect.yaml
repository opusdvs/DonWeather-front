{{- if and .Values.httpRoute.enabled .Values.httpRoute.redirectToHttps.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "donweather-front.fullname" . }}-http-to-https-redirect
  labels:
    {{- include "donweather-front.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.redirectToHttps.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.redirectToHttps.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ .Values.httpRoute.redirectToHttps.scheme | quote }}
            port: {{ .Values.httpRoute.redirectToHttps.port }}
            statusCode: {{ .Values.httpRoute.redirectToHttps.statusCode }}
{{- end }}

