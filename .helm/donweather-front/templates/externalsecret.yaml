{{- if .Values.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "donweather-front.fullname" . }}-ms-weather
  labels:
    {{- include "donweather-front.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
  target:
    name: {{ include "donweather-front.externalSecretTargetName" . | quote }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy | quote }}
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}

