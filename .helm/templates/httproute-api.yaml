{{- if and .Values.httpRoute.enabled .Values.httpRoute.api.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "donweather-front.fullname" . }}-ms-weather
  labels:
    {{- include "donweather-front.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- if .Values.httpRoute.api.parentRefs }}
    {{- toYaml .Values.httpRoute.api.parentRefs | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
    {{- end }}
  hostnames:
    {{- if .Values.httpRoute.api.hostnames }}
    {{- toYaml .Values.httpRoute.api.hostnames | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.api.pathPrefix | quote }}
      backendRefs:
        - name: {{ .Values.httpRoute.api.backend.name | quote }}
          port: {{ .Values.httpRoute.api.backend.port }}
          weight: 1
{{- end }}

