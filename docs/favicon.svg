<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90D9E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A9FD4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="100" height="100" fill="#222831" rx="18"/>
  
  <!-- Облако (упрощенное) -->
  <ellipse cx="35" cy="50" rx="20" ry="15" fill="url(#grad)"/>
  <ellipse cx="50" cy="50" rx="18" ry="12" fill="url(#grad)"/>
  <ellipse cx="65" cy="50" rx="15" ry="10" fill="url(#grad)"/>
  
  <!-- Солнце/Термометр (простой символ) -->
  <circle cx="70" cy="30" r="8" fill="url(#grad)"/>
  <line x1="70" y1="22" x2="70" y2="38" stroke="#222831" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="30" x2="78" y2="30" stroke="#222831" stroke-width="2" stroke-linecap="round"/>
</svg>
